name: Playwright Tests Dispatch Workflow run fresh allure report
on:
  workflow_dispatch:
    inputs:
      Tagname:
        description: 'Tag to execute test cases'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - sanity
          - regression
          - gorest
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Clean up existing results in workspace
      run: |
        rm -rf allure-results
        rm -rf allure-report
        rm -rf playwright-report

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        BROWSER: ${{ secrets.BROWSER_NAME }}
      run: npx playwright test --grep "@${{ inputs.Tagname }}" --project="$BROWSER"

    - name: Generate Allure report
      if: always()
      run: npx allure generate allure-results --clean -o allure-report

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
        path: playwright-report/
        retention-days: 30

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ github.run_id }}-${{ github.run_attempt }}
        path: allure-report/
        retention-days: 30